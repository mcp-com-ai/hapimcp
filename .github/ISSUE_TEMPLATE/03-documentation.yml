name: Documentation improvement
description: Report missing, unclear, or incorrect HAPI documentation.
title: "[Docs]: "
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      description: Which product's documentation is affected?
      options:
        - HAPI MCP
        - OrcA
        - runMCP
    validations:
      required: true
  - type: dropdown
    id: plugin
    attributes:
      label: HAPI MCP plugin
      description: If Product is HAPI MCP, select the plugin. Otherwise choose Not applicable / not sure.
      options:
        - Not applicable / not sure
        - Jev MCP
        - OpenAPI
        - Arazzo
        - Capability Planning
        - OTel
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Add a URL or path to the page or section, if known.
    validations:
      required: false
  - type: textarea
    id: issue
    attributes:
      label: What needs improvement?
      description: Explain what is missing, unclear, or incorrect.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: How could the documentation be improved?
    validations:
      required: false